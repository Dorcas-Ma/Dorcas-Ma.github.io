<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>究极绿宝石小智版 宝可梦攻略站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: url("bg.jpg") center/cover fixed;
            background-color: rgba(15, 76, 58, 0.85);
            background-blend-mode: overlay;
            color: #fff;
        }
        .page {
            display: none;
            padding: 20px;
            min-height: 100vh;
        }
        .page.show {
            display: block !important;
        }
        .home {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 30px;
        }
        .home h1 {
            font-size: 36px;
            color: #98d8aa;
            text-shadow: 0 0 10px #000;
        }
        .enter {
            padding: 16px 40px;
            font-size: 20px;
            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .back {
            padding: 8px 20px;
            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .item {
            background: rgba(27, 67, 50, 0.9);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
        .item img {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 4px;
        }
        .detail {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(27, 67, 50, 0.95);
            padding: 25px;
            border-radius: 15px;
        }
        .detail-top {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .detail-img {
            width: 200px;
            height: 200px;
            background: #fff;
            border-radius: 12px;
            padding: 15px;
        }
        .info {
            margin: 8px 0;
            font-size: 15px;
        }
        .info strong {
            color: #98d8aa;
        }
    </style>
</head>

<body>

<audio src="https://mir-s.cdn.okecdn.com/mp3/2025/05/25/104650685.mp3" autoplay loop></audio>

<div id="page1" class="page show">
    <div class="home">
        <h1>究极绿宝石小智版 宝可梦攻略站</h1>
        <button class="enter" onclick="go(2)">进入攻略</button>
    </div>
</div>

<div id="page2" class="page">
    <button class="back" onclick="go(1)">返回首页</button>
    <h2 style="text-align:center; margin-bottom:20px; color:#98d8aa;">综合强度 TOP30</h2>
    <div class="grid" id="list"></div>
</div>

<div id="page3" class="page">
    <button class="back" onclick="go(2)">返回列表</button>
    <div class="detail">
        <div class="detail-top">
            <img class="detail-img" id="dimg">
            <div>
                <h2 id="dname" style="color:#98d8aa; margin-bottom:15px;"></h2>
                <div class="info"><strong>性格：</strong><span id="dnature"></span></div>
                <div class="info"><strong>特性：</strong><span id="dability"></span></div>
                <div class="info"><strong>技能：</strong><span id="dskill"></span></div>
                <div class="info"><strong>道具：</strong><span id="ditem"></span></div>
                <div class="info"><strong>玩法：</strong><span id="dplay"></span></div>
            </div>
        </div>
    </div>
</div>

<script>
const data = [
{rank:1,name:"烈空坐",img:"https://img.pokemondb.net/sprites/home/normal/rayquaza.png",nature:"爽朗",ability:"天气锁",skill:"画龙点睛+神速+地震+龙舞",item:"烈空坐超级石",play:"龙舞强化推队，版本最强"},
{rank:2,name:"超梦",img:"https://img.pokemondb.net/sprites/home/normal/mewtwo.png",nature:"胆小",ability:"压迫感",skill:"精神冲击+影子球+冥想",item:"超梦进化石",play:"高速特攻炮台"},
{rank:3,name:"盖欧卡",img:"https://img.pokemondb.net/sprites/home/normal/kyogre.png",nature:"内敛",ability:"降雨",skill:"水炮+打雷+冰冻光束",item:"潮湿岩石",play:"雨天队核心"},
{rank:4,name:"固拉多",img:"https://img.pokemondb.net/sprites/home/normal/groudon.png",nature:"固执",ability:"日照",skill:"断崖之剑+闪焰冲锋+剑舞",item:"炽热岩石",play:"晴天队核心"},
{rank:5,name:"烈咬陆鲨",img:"https://img.pokemondb.net/sprites/home/normal/garchomp.png",nature:"爽朗",ability:"沙隐",skill:"地震+龙爪+剑舞",item:"超级石",play:"沙暴队强力物攻手"}
];

function go(n) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
    document.getElementById('page'+n).classList.add('show');
}

function loadList() {
    let html = '';
    data.forEach((p, i) => {
        html += `
        <div class="item" onclick="openDetail(${i})">
            <div style="color:#98d8aa;">TOP${p.rank}</div>
            <img src="${p.img}">
            <div>${p.name}</div>
        </div>`;
    });
    document.getElementById('list').innerHTML = html;
}

function openDetail(i) {
    const d = data[i];
    document.getElementById('dimg').src = d.img;
    document.getElementById('dname').innerText = d.name;
    document.getElementById('dnature').innerText = d.nature;
    document.getElementById('dability').innerText = d.ability;
    document.getElementById('dskill').innerText = d.skill;
    document.getElementById('ditem').innerText = d.item;
    document.getElementById('dplay').innerText = d.play;
    go(3);
}

window.onload = function() {
    loadList();
}
</script>

</body>
</html>
