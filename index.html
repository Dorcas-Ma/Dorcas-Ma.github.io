<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>究极绿宝石小智版 宝可梦攻略站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: url("bg.jpg") center/cover fixed;
            color: #fff;
            font-family: "微软雅黑", sans-serif;
        }
        .box {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            background-color: rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 36px;
            color: #98d8aa;
            text-shadow: 0 0 10px #000;
        }
        p {
            font-size: 18px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>究极绿宝石小智版 宝可梦攻略站</h1>
        <p>背景图正常显示，文字和按钮也能看到了！</p>
    </div>
</body>
</html>
