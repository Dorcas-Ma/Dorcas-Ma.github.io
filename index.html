            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .list-wrap {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        .pokemon-item {
            background: rgba(27, 67, 50, 0.9);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
        }
        .pokemon-item img {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 5px;
        }
        .rank-text {
            color: #98d8aa;
            font-weight: bold;
        }
        .detail-box {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(27, 67, 50, 0.95);
            padding: 30px;
            border-radius: 15px;
        }
        .detail-top {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        .detail-img {
            width: 220px;
            height: 220px;
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
            padding: 15px;
        }
        .info-line {
            margin: 10px 0;
            font-size: 16px;
        }
        .info-line strong {
            color: #98d8aa;
        }
        .effect {
            color: #c1e3c8;
            font-size: 14px;
            margin-left: 10px;
            font-style: italic;
        }

        .comment-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #40916c;
        }
        .comment-title {
            font-size: 18px;
            color: #98d8aa;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .comment-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 15px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.9);
        }
        .comment-btn {
            padding: 8px 16px;
            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .comment-list {
            margin-top: 20px;
            max-height: 220px;
            overflow-y: auto;
        }
        .comment-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;

</head>

    </div>
  </div>
</div>

function goList(){
  showPage("listPage");
}
function goDetail(){
  showPage("detailPage");
}
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  document.getElementById(id).classList.add("show");
}

function initList(){
  let html = "";
  for(let i=0;i<pokeData.length;i++){
    let p = pokeData[i];
    html+=`
    <div class="pokemon-item" onclick="openDetail(${i})">
      <div class="rank-text">TOP${p.rank}</div>
      <img src="${p.img}">
      <div>${p.name}</div>
    </div>`;
  }
  document.getElementById("listCon").innerHTML = html;
}

function openDetail(i){
  currentPokeIndex = i;
  let d = pokeData[i];
  document.getElementById("dImg").src = d.img;
  document.getElementById("dName").innerText = d.name;
  document.getElementById("dNature").innerText = d.nature;
  document.getElementById("dAbility").innerText = d.ability;
  document.getElementById("dAbEff").innerText = "（"+d.abEff+"）";
  document.getElementById("dSkill").innerText = d.skill;
  document.getElementById("dSkEff").innerText = "效果："+d.skEff;
  document.getElementById("dItem").innerText = d.item;
  document.getElementById("dItEff").innerText = "（"+d.itEff+"）";
  document.getElementById("dPlay").innerText = d.play;
  renderComment();
  goDetail();
}

function submitComment(){
  let input = document.getElementById("commentInput");
  let val = input.value.trim();
  if(!val) return;
  if(!comments[currentPokeIndex]) comments[currentPokeIndex] = [];
  comments[currentPokeIndex].push(val);
  input.value = "";
  renderComment();
}

function renderComment(){
  let list = document.getElementById("commentList");
  let arr = comments[currentPokeIndex] || [];
  let html = "";
  arr.forEach(c=>{
    html+=`<div class="comment-item">${c}</div>`;
  });
  list.innerHTML = html;
}

window.onload = initList;
</script>
</body>
</html>
